name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # re-run publishing by hand (e.g. after adding NPM_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
          verbose: true

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # npm provenance: links the package to this workflow run
    env:
      # setup-node injects a placeholder NODE_AUTH_TOKEN, so test the secret itself.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm launcher
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Skip (no NPM_TOKEN secret)
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "Add an NPM_TOKEN repository secret to publish the npx launcher."
